# Daily fare collection, run by GitHub rather than by a laptop.
#
# Why this exists: the series is wall-clock bound — a day not fetched on the
# day is gone forever. Two failure modes survived every local fix. The machine
# was off all day on 2026-09-18 and 09-19, which no scheduled task can solve,
# and the campus network drops the Postgres ports outright. A hosted runner has
# neither problem: it is always awake and its egress is unrestricted.
#
# The local Task Scheduler job can stay enabled alongside this. Whichever runs
# first collects; the other sees the day already done in `collection_run` and
# skips without fetching (apix.ops.collection_health.decide). Two independent
# schedulers, no duplicate rows — the daily-observation unique index in
# sql/0002 makes that safe even if they race.
#
# SETUP (one time, in the GitHub web UI):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:   DATABASE_URL
#     Value:  the pooler URL from your .env, in full
#   Use the SESSION POOLER host (aws-0-...pooler.supabase.com), never
#   db.<ref>.supabase.co: GitHub's runners are IPv4-only and that host
#   publishes an AAAA record only. This is the same failure that cost nine
#   runs on 2026-09-15. Supabase's dashboard offers the direct string first,
#   so this is an easy one to get wrong; the preflight step below names the
#   host it actually tried, which is how you tell the two apart.
#
# This repo is public. Secrets are encrypted and are not exposed to workflow
# runs from forks; never echo $DATABASE_URL in a step.

name: collect

on:
  schedule:
    # Three attempts a day, in UTC. GitHub's scheduler is best-effort and can
    # be delayed by many minutes under load, so this does not rely on any one
    # of them firing: a source already collected today costs one small query
    # and no network request.
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "30 8 * * *"   # 14:00 IST
    - cron: "30 14 * * *"  # 20:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch every source even if today is already collected"
        type: boolean
        default: false

# Never let two collection runs overlap: they would fetch the same sources at
# the same moment, which is the opposite of the politeness posture in docs/01.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # Before fetching anything: a runner that cannot reach the database has
      # nowhere to put what it collects. The spool cannot save it the way it
      # saves a laptop, because the container is deleted at the end of the job.
      # Both scheduled runs on 2026-09-23 fetched ten OTA pages and then threw
      # them away; this step is why that cannot happen again. The failure is
      # emitted as an annotation naming the host, so it is diagnosable from the
      # run list without opening the log.
      - name: Check the database is reachable
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/preflight_db.py

      - name: Collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Identified and contactable, as docs/01 requires of every request.
          APIX_USER_AGENT: "APIx-Collector/0.1 (+mailto:adirane08@gmail.com; research project, see robots.txt)"
          APIX_CONTACT_EMAIL: adirane08@gmail.com
          RAW_STORE_PATH: ./data/raw
          SPOOL_PATH: ./data/spool
        run: |
          python scripts/run_collection.py ${{ inputs.force && '--force' || '' }}

      - name: Report collection health
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Never fails the job: a stale source is already reported by the step
        # above, and this is here to put the missed days in the run log.
        run: python scripts/check_collection.py || true

      # A runner is ephemeral, so anything left in the spool is an observation
      # that exists nowhere else. Keep it before the machine disappears.
      - name: Check for un-uploaded observations
        if: always()
        id: spool
        run: |
          if [ -n "$(ls -A data/spool/pending 2>/dev/null)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::error::Collected runs could not be written to the database. They are in the artifact below and exist nowhere else."
            ls -la data/spool/pending
          fi

      - name: Save un-uploaded observations
        if: always() && steps.spool.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spool-pending-${{ github.run_id }}
          path: data/spool/pending
          retention-days: 90

      - name: Fail if observations were lost
        if: always() && steps.spool.outputs.pending == 'true'
        run: exit 1
